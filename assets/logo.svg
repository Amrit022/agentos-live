<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="ForexMaster Pro">
  <defs>
    <linearGradient id="fm-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="fm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1629"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <filter id="fm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#fm-bg)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="rgba(212,168,67,0.22)" stroke-width="1"/>

  <!-- Candlesticks -->
  <g opacity="0.85">
    <line x1="11" y1="21" x2="11" y2="33" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="9.5" y="24" width="3" height="7" rx="0.8" fill="#10b981"/>
    <line x1="17" y1="19" x2="17" y2="30" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="15.5" y="21" width="3" height="6" rx="0.8" fill="#ef4444" opacity="0.75"/>
    <line x1="23" y1="17" x2="23" y2="28" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="21.5" y="19" width="3" height="7" rx="0.8" fill="#10b981"/>
  </g>

  <!-- Trend line + arrow -->
  <g filter="url(#fm-glow)">
    <path d="M7 34 L16 26 L22 29 L36 13" fill="none" stroke="url(#fm-grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 13 H36 V19" fill="none" stroke="url(#fm-grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
