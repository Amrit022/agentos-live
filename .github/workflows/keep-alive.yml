name: Keep Render Awake

on:
  schedule:
    # Every 10 minutes — Render free tier sleeps after 15 minutes idle
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping website
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" --max-time 60 https://www.agentosacademy.com/ || true
