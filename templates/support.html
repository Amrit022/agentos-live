<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — SafeFleet Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg-void: #0f172a; --card-surface: rgba(15, 23, 42, 0.85); --border-dim: rgba(255, 255, 255, 0.08); --accent-amber: #f59e0b; --accent-green: #22c55e; --text-primary: #ffffff; --text-secondary: #94a3b8; }
  body { background-color: var(--bg-void); color: var(--text-primary); font-family: 'Inter', sans-serif; margin: 0; padding: 48px; }
  .container { max-width: 600px; margin: 0 auto; background: var(--card-surface); padding: 40px; border-radius: 16px; border: 1px solid var(--border-dim); }
  h1 { font-family: 'Space Grotesk'; font-size: 32px; margin-top: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border-dim); padding-bottom: 16px;}
  .form-group { margin-bottom: 24px; }
  label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 14px; }
  input, textarea { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-dim); color: #fff; border-radius: 8px; font-family: 'Inter'; box-sizing: border-box;}
  input:focus, textarea:focus { border-color: var(--accent-amber); outline: none; }
  .btn { background: var(--accent-amber); color: #000; padding: 12px 24px; border: none; border-radius: 8px; font-family: 'Space Grotesk'; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px;}
  .btn:hover { box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
  .btn-outline { display: inline-block; text-align: center; background: transparent; color: #fff; padding: 12px 24px; border: 1px solid var(--border-dim); border-radius: 8px; text-decoration: none; width: 100%; box-sizing: border-box; margin-top: 16px; font-family: 'Space Grotesk'; font-weight: 700;}
  .btn-outline:hover { border-color: var(--accent-amber); }
  .msg { background: rgba(245, 158, 11, 0.1); color: var(--accent-amber); padding: 12px; border-radius: 8px; margin-bottom: 24px; text-align: center; border: 1px solid var(--accent-amber); }
</style>
</head>
<body>
  <div class="container">
    <h1>Training <span style="color: var(--accent-amber);">Support</span></h1>
    {% if msg %}
      <div class="msg">{{ msg }}</div>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <label>Subject</label>
        <input type="text" name="subject" placeholder="e.g., Cannot access CoR training module" required>
      </div>
      <div class="form-group">
        <label>Description of Issue</label>
        <textarea name="message" rows="6" placeholder="Please describe your issue in detail. Include the course name, any error messages, and steps you've taken so we can help you quickly..." required></textarea>
      </div>
      <button type="submit" class="btn">Submit Support Request</button>
      <a href="/portal" class="btn-outline">Return to Training Portal</a>
    </form>
  </div>
</body>
</html>
