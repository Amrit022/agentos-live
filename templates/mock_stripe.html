<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeFleet Academy Secure Payment</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #f8fafc;
    --card-surface: rgba(255, 255, 255, 0.9);
    --border-dim: rgba(15, 23, 42, 0.08);
    --border-bright: rgba(15, 23, 42, 0.15);
    --neon-blue: #1a73e8;
    --text-primary: #0f172a;
    --text-secondary: #475569;
  }
  body {
    background-color: var(--bg-void); color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0; display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  /* GRID BG */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background-image: linear-gradient(var(--border-dim) 1px, transparent 1px), linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at center, black, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%);
  }

  .checkout-container {
    background: var(--card-surface);
    border: 1px solid var(--border-bright);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    backdrop-filter: blur(20px);
  }
  .header {
    background: rgba(26, 115, 232, 0.05);
    border-bottom: 1px solid var(--border-dim);
    padding: 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
  }
  
  .header h2 { font-family: 'Space Grotesk', sans-serif; margin: 0 0 16px 0; font-weight: 700; font-size: 20px; color: var(--text-primary);}
  .header .amount { font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 700; color: var(--neon-blue); margin: 0; text-shadow: 0 0 10px rgba(26, 115, 232, 0.25);}
  
  .form-content { padding: 32px; }
  
  .test-badge {
    background: rgba(15, 23, 42, 0.03);
    color: var(--text-secondary);
    padding: 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 24px;
    text-align: center;
    border: 1px dashed var(--border-dim);
  }
 
  .input-group { margin-bottom: 20px; }
  .input-group label {
    display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text-secondary);
  }
  .input-group input {
    width: 100%; padding: 14px;
    background: #fff; border: 1px solid var(--border-dim);
    border-radius: 8px; font-size: 15px; color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    box-sizing: border-box; outline: none; transition: border-color 0.2s;
  }
  .input-group input:disabled { color: var(--text-secondary); cursor: not-allowed; }
 
  .btn {
    background: var(--neon-blue);
    color: #fff; border: none; border-radius: 8px;
    width: 100%; padding: 16px;
    font-size: 16px; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 16px; box-shadow: 0 4px 15px rgba(26, 115, 232, 0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26, 115, 232, 0.45); }
  .btn:active { transform: scale(0.98); }
  
  .btn-cancel {
    background: transparent; color: var(--text-secondary);
    margin-top: 16px; box-shadow: none; border: 1px solid var(--border-dim);
  }
  .btn-cancel:hover { background: rgba(15, 23, 42, 0.05); color: var(--text-primary); transform: none; box-shadow: none;}

  .footer {
    text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-secondary);
  }
</style>
</head>
<body>

<div class="checkout-container">
  <div class="header">
    <img src="/static/logo.png" alt="Logo" style="width: 40px; height: 40px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);">
    <h2>SafeFleet Gateway</h2>
    <div class="amount">${{ amount }}</div>
  </div>
  
  <div class="form-content">
    <div class="test-badge">
      Test Environment: Bypassing real payment processing to instantly unlock video portal.
    </div>

    <div class="input-group">
      <label>Encrypted Connection</label>
      <input type="text" value="AES-256 Bit Secure Connection Established" disabled>
    </div>

    <div class="input-group">
      <label>Test Card Data</label>
      <input type="text" value="XXXX-XXXX-XXXX-4242" disabled style="margin-bottom: 8px; font-family: 'JetBrains Mono';">
    </div>
    
    <button class="btn" id="payBtn" onclick="simulatePayment()">Authorize Payment</button>
    <button class="btn btn-cancel" onclick="window.location.href='/cart'">Cancel Order</button>

    <div class="footer">
      🔒 Protected by SafeFleet Secure Protocol
    </div>
  </div>
</div>

<script>
  function simulatePayment() {
    const btn = document.getElementById('payBtn');
    btn.innerText = 'Decrypting Transponder...';
    btn.style.opacity = '0.8';
    btn.disabled = true;
    
    setTimeout(() => {
      btn.innerText = 'Payment Successful! Redirecting...';
      btn.style.background = '#00ff66';
      btn.style.boxShadow = '0 0 20px rgba(0, 255, 102, 0.4)';
      setTimeout(() => {
        // Redirect back to our app's success callback with a fake session ID
        window.location.href = '/checkout/success?session_id=mock_session_id&order_id={{ order_id }}';
      }, 800);
    }, 1200);
  }
</script>

</body>
</html>
