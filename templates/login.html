<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — NEXORA Admin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/static/css/nexora.css">
    
    <style>
        body {
            background-color: #060613;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(15, 17, 41, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(25px);
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 8px;
        }
        .login-header h1 span {
            color: var(--cyan);
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .login-form .form-group {
            margin-bottom: 24px;
        }
        .login-form .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .login-form .form-control {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        .login-form .form-control:focus {
            border-color: var(--cyan);
            box-shadow: var(--cyan-glow);
            background: rgba(255,255,255,0.09);
        }
        .btn-login {
            width: 100%;
            background: var(--gradient);
            border: none;
            color: #060613;
            font-weight: 700;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-shadow: var(--cyan-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
        }
        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #ff8888;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-home {
            text-align: center;
            margin-top: 24px;
        }
        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }
        .back-home a:hover {
            color: var(--cyan);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>NEX<span>ORA</span> Admin</h1>
            <p>Log in to access your dropshipping control console.</p>
        </div>
        
        {% if error %}
            <div class="error-banner">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
        {% endif %}
        
        <form class="login-form" method="POST" action="/login">
            <div class="form-group">
                <label class="form-label" for="admin-password">Administrator Password</label>
                <input type="password" id="admin-password" name="password" class="form-control" placeholder="Enter system password" required autofocus>
            </div>
            
            <button type="submit" class="btn-login">
                <i class="fa-solid fa-shield-halved"></i> Log In to Console
            </button>
        </form>
        
        <div class="back-home">
            <a href="/"><i class="fa-solid fa-arrow-left"></i> Return to Storefront</a>
        </div>
    </div>

</body>
</html>
