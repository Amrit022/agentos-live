<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout — AgentOS</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #000000;
    --card-surface: rgba(12, 12, 14, 0.7);
    --border-dim: rgba(255, 255, 255, 0.08);
    --border-bright: rgba(255, 255, 255, 0.25);
    --neon-blue: #00e5ff;
    --neon-purple: #b537f2;
    --neon-green: #00ff66;
    --text-primary: #ffffff;
    --text-secondary: #8892b0;
  }

  body {
    background-color: var(--bg-void); color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0; padding: 40px; position: relative; min-height: 100vh; z-index: 1;
  }
  
  /* GRID BG */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background-image: linear-gradient(var(--border-dim) 1px, transparent 1px), linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at top right, black, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at top right, black, transparent 80%);
  }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border-dim); padding-bottom: 24px; max-width: 1200px; margin: 0 auto 40px auto; }
  h1 { font-family: 'Space Grotesk', sans-serif; margin: 0; font-size: 32px; font-weight: 900; }
  .btn-outline { background: transparent; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border-bright); transition: border-color 0.3s; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-size: 14px;}
  .btn-outline:hover { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0,229,255,0.2); }
  
  .btn-neon { background: var(--neon-blue); color: #000; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; padding: 16px 32px; border-radius: 8px; border: none; cursor: pointer; width: 100%; display: block; text-align: center; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);}
  .btn-neon:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 229, 255, 0.6); }
  
  .cart-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
  @media (max-width: 900px) { .cart-container { grid-template-columns: 1fr; } }
  
  .cart-item { background: var(--card-surface); border: 1px solid var(--border-dim); border-radius: 16px; padding: 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; backdrop-filter: blur(20px); transition: border-color 0.3s; }
  .cart-item:hover { border-color: rgba(0, 229, 255, 0.3); }
  .item-name { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 4px;}
  .item-price { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--neon-blue); font-weight: 700; }
  .remove-btn { color: #ff4d4d; background: none; border: none; cursor: pointer; font-size: 13px; margin-top: 12px; opacity: 0.8;}
  .remove-btn:hover { opacity: 1; text-decoration: underline; }
  
  .summary-card, .billing-card { background: var(--card-surface); border: 1px solid var(--border-dim); border-radius: 16px; padding: 32px; backdrop-filter: blur(20px); }
  .summary-card { position: sticky; top: 40px; height: fit-content; }
  
  .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 24px; border-bottom: 1px solid var(--border-dim); padding-bottom: 16px; color: #fff;}
  
  .summary-row { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 15px; color: var(--text-secondary); }
  .summary-total { display: flex; justify-content: space-between; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-dim); font-size: 18px; align-items: center; }
  .total-value { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; color: #fff; }
  
  .promo-box { display: flex; gap: 8px; margin-bottom: 24px; }
  .form-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border-dim); border-radius: 8px; padding: 14px; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; outline: none; box-sizing: border-box; transition: border-color 0.2s;}
  .form-input:focus { border-color: var(--neon-blue); }
  .promo-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-bright); color: #fff; border-radius: 8px; padding: 0 16px; cursor: pointer; font-family: 'Space Grotesk', sans-serif;}
  .promo-btn:hover { border-color: var(--neon-blue); }
  .discount-row { color: var(--neon-green); display: none; }
  
  .trust-badges { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; }
  .trust-badge { display: flex; align-items: center; gap: 12px; color: var(--text-secondary); font-size: 13px; }
  .trust-icon { font-size: 18px; }
  
  .billing-card { margin-top: 24px; display: none; }
  .form-group { margin-bottom: 20px; }
  .form-label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary); }
  .form-row { display: flex; gap: 16px; }
  .form-row .form-group { flex: 1; }
  @media (max-width: 600px) { .form-row { flex-direction: column; gap: 0; } }
  
  .empty { text-align: center; padding: 100px; color: var(--text-secondary); font-size: 18px; grid-column: 1 / -1; }
</style>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="/static/logo.png" alt="AgentOS Logo" style="width: 32px; height: 32px; border-radius: 6px;">
      <h1>Secure <span style="color: var(--neon-blue);">Checkout</span></h1>
    </div>
    <a href="/#products" class="btn-outline">← Back to Store</a>
  </div>
  
  <div class="cart-container" id="mainContainer">
    <div style="display: flex; flex-direction: column;">
      <div id="cartItems"></div>
      
      <div class="billing-card" id="billingCard">
        <div class="card-title">Terminal Access Details</div>
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" id="fName" class="form-input" placeholder="John" required>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" id="lName" class="form-input" placeholder="Doe" required>
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Email Address (For Portal Access)</label>
          <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
        </div>
        
        <div class="form-group" style="margin-top: 32px; padding-top: 24px; border-top: 1px dashed var(--border-dim);">
          <label class="form-label" style="color: var(--neon-blue);">Initialize Portal Password</label>
          <p style="font-size: 13px; color: var(--text-secondary); margin-top: 0; margin-bottom: 12px;">We will immediately provision a secure Video Portal account for your masterclasses.</p>
          <input type="password" id="password" class="form-input" placeholder="Enter secure password" required>
        </div>
      </div>
    </div>
    
    <div class="summary-card" id="summaryCard" style="display: none;">
      <div class="card-title">Order Summary</div>
      
      <div class="promo-box">
        <input type="text" id="promoCode" class="form-input" placeholder="Promo code">
        <button class="promo-btn" onclick="applyPromo()">Apply</button>
      </div>
      <div id="promoMsg" style="color: var(--neon-green); font-size: 12px; margin-top: -16px; margin-bottom: 16px; display: none;">Code applied!</div>
      
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotalValue" style="font-family: 'JetBrains Mono';">$0</span>
      </div>
      <div class="summary-row discount-row" id="discountRow">
        <span>Discount (20%)</span>
        <span id="discountValue" style="font-family: 'JetBrains Mono';">-$0</span>
      </div>
      
      <div class="summary-total">
        <span>Total</span>
        <span class="total-value" id="totalValue">$0</span>
      </div>
      
      <button id="checkoutBtn" class="btn-neon" style="margin-top: 32px;" onclick="initPayPal()">Initiate Secure Payment</button>
      <div id="paypal-button-container" style="margin-top: 16px; display: none;"></div>
      
      <div class="trust-badges">
        <div class="trust-badge">
          <span class="trust-icon">🔒</span>
          <span>AES-256 Bit Encrypted</span>
        </div>
        <div class="trust-badge">
          <span class="trust-icon">⚡</span>
          <span>Instant Portal Provisioning</span>
        </div>
        <div class="trust-badge">
          <span class="trust-icon">🛡️</span>
          <span>Secured by PayPal</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentSubtotal = 0;
    let isDiscountApplied = false;

    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('wealthweb_cart')) || [];
      const container = document.getElementById('cartItems');
      const summaryCard = document.getElementById('summaryCard');
      const mainContainer = document.getElementById('mainContainer');
      
      if (cart.length === 0) {
        mainContainer.innerHTML = '<div class="empty">Your cart is empty.<br><br><a href="/#products" class="btn-outline">Browse Products</a></div>';
        return;
      }
      
      currentSubtotal = 0;
      container.innerHTML = cart.map((item, index) => {
        currentSubtotal += item.price;
        return `
          <div class="cart-item" id="item-${index}">
            <div style="display: flex; gap: 20px; align-items: center;">
              <div style="font-size: 32px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-dim); width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 12px;">${item.icon || '📦'}</div>
              <div>
                <div class="item-name">${item.name}</div>
                <div style="color: var(--text-secondary); font-size: 14px; margin-top: 4px; max-width: 400px;">${item.desc || ''}</div>
                <button class="remove-btn" onclick="removeItem(${index})">[x] Remove</button>
              </div>
            </div>
            <div class="item-price">$${item.price}</div>
          </div>
        `;
      }).join('');
      
      summaryCard.style.display = 'block';
      document.getElementById('billingCard').style.display = 'block';
      updateTotals();
    }

    function updateTotals() {
      document.getElementById('subtotalValue').innerText = '$' + currentSubtotal.toFixed(2);
      
      let finalTotal = currentSubtotal;
      
      if (isDiscountApplied) {
        let discount = currentSubtotal * 0.20;
        finalTotal = currentSubtotal - discount;
        document.getElementById('discountRow').style.display = 'flex';
        document.getElementById('discountValue').innerText = '-$' + discount.toFixed(2);
      } else {
        document.getElementById('discountRow').style.display = 'none';
      }
      
      document.getElementById('totalValue').innerText = '$' + finalTotal.toFixed(2);
    }

    function applyPromo() {
      const code = document.getElementById('promoCode').value.toUpperCase();
      if (code === 'LAUNCH20') {
        isDiscountApplied = true;
        document.getElementById('promoMsg').style.display = 'block';
        document.getElementById('promoMsg').innerText = 'LAUNCH20 applied (20% off)!';
        updateTotals();
      } else if (code.trim() !== '') {
        document.getElementById('promoMsg').style.display = 'block';
        document.getElementById('promoMsg').style.color = '#ff4d4d';
        document.getElementById('promoMsg').innerText = 'Invalid promo code.';
        setTimeout(() => { document.getElementById('promoMsg').style.display = 'none'; document.getElementById('promoMsg').style.color = 'var(--neon-green)'; }, 3000);
      }
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('wealthweb_cart')) || [];
      const itemEl = document.getElementById('item-' + index);
      
      itemEl.style.opacity = '0';
      itemEl.style.transform = 'translateX(-20px)';
      
      setTimeout(() => {
        cart.splice(index, 1);
        localStorage.setItem('wealthweb_cart', JSON.stringify(cart));
        loadCart();
      }, 300);
    }

    let paypalLoaded = false;
    let internalOrderId = null;
    let orderTotal = '0.00';

    async function initPayPal() {
      const fName = document.getElementById('fName').value;
      const lName = document.getElementById('lName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if(!fName || !lName || !email || !password) {
        alert("Please provide terminal access details (Name, Email, Password).");
        return;
      }
      
      const cart = JSON.parse(localStorage.getItem('wealthweb_cart')) || [];
      const total = isDiscountApplied ? currentSubtotal * 0.8 : currentSubtotal;
      
      const btn = document.getElementById('checkoutBtn');
      btn.innerText = 'Initializing Secure Gateway...';
      btn.disabled = true;
      
      try {
        // Step 1: Create order in our backend
        const res = await fetch('/api/create-checkout-session', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            name: fName + ' ' + lName,
            email: email,
            items: cart,
            total: total,
            password: password
          })
        });
        
        const data = await res.json();
        if (data.error) {
          alert("Error: " + data.error);
          btn.innerText = 'Initiate Secure Payment';
          btn.disabled = false;
          return;
        }
        
        internalOrderId = data.internal_order_id;
        orderTotal = data.total;
        
        // Step 2: Load PayPal SDK and show buttons
        btn.style.display = 'none';
        document.getElementById('paypal-button-container').style.display = 'block';
        
        if (!paypalLoaded) {
          const script = document.createElement('script');
          script.src = `https://www.paypal.com/sdk/js?client-id=${data.paypal_client_id}&currency=USD&intent=capture`;
          script.onload = () => {
            paypalLoaded = true;
            renderPayPalButtons();
          };
          script.onerror = () => {
            document.getElementById('paypal-button-container').innerHTML = '<div style="text-align:center;padding:20px;color:#ff4d4d;font-family:Space Grotesk;">PayPal failed to load. Please disable ad-blockers and try again.</div>';
            console.error('PayPal SDK failed to load. Client ID:', data.paypal_client_id);
          };
          document.head.appendChild(script);
        } else {
          renderPayPalButtons();
        }
        
      } catch (err) {
        alert("Error connecting to payment gateway.");
        btn.innerText = 'Initiate Secure Payment';
        btn.disabled = false;
      }
    }

    function renderPayPalButtons() {
      document.getElementById('paypal-button-container').innerHTML = '';
      
      paypal.Buttons({
        style: {
          color: 'blue',
          shape: 'rect',
          label: 'pay',
          height: 50
        },
        createOrder: function(data, actions) {
          return actions.order.create({
            purchase_units: [{
              description: 'AgentOS AI Blueprint',
              amount: {
                value: orderTotal
              }
            }]
          });
        },
        onApprove: async function(data, actions) {
          // Capture the payment
          const order = await actions.order.capture();
          
          // Verify on our server
          const btn = document.getElementById('checkoutBtn');
          const container = document.getElementById('paypal-button-container');
          container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--neon-green); font-family: Space Grotesk; font-weight: 700;">✅ Payment Successful! Provisioning your account...</div>';
          
          try {
            const verifyRes = await fetch('/api/verify-payment', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                paypal_order_id: data.orderID,
                internal_order_id: internalOrderId
              })
            });
            
            const verifyData = await verifyRes.json();
            if (verifyData.success) {
              localStorage.removeItem('wealthweb_cart');
              container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--neon-green); font-family: Space Grotesk; font-weight: 700; font-size: 18px;">🚀 Account Created! Redirecting to Dashboard...</div>';
              setTimeout(() => { window.location.href = verifyData.redirect; }, 2000);
            }
          } catch (err) {
            container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--neon-green); font-family: Space Grotesk;">Payment received! Redirecting...</div>';
            setTimeout(() => { window.location.href = '/portal'; }, 2000);
          }
        },
        onCancel: function() {
          document.getElementById('paypal-button-container').style.display = 'none';
          const btn = document.getElementById('checkoutBtn');
          btn.style.display = 'block';
          btn.innerText = 'Initiate Secure Payment';
          btn.disabled = false;
        },
        onError: function(err) {
          alert('Payment error. Please try again.');
          document.getElementById('paypal-button-container').style.display = 'none';
          const btn = document.getElementById('checkoutBtn');
          btn.style.display = 'block';
          btn.innerText = 'Initiate Secure Payment';
          btn.disabled = false;
        }
      }).render('#paypal-button-container');
    }

    loadCart();
  </script>
</body>
</html>
