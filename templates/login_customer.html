<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learner Login — SafeFleet Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0f172a;
    --card-surface: rgba(15, 23, 42, 0.85);
    --border-dim: rgba(255, 255, 255, 0.1);
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --text-primary: #ffffff;
    --text-secondary: #94a3b8;
  }
  body {
    background-color: var(--bg-void); color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    margin: 0; display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
  }
  /* GRID BG */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background-image: linear-gradient(var(--border-dim) 1px, transparent 1px), linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(circle at center, black, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at center, black, transparent 70%);
  }

  .login-container {
    background: var(--card-surface); border: 1px solid var(--border-dim);
    border-radius: 16px; padding: 48px; width: 100%; max-width: 400px;
    box-shadow: 0 0 40px rgba(245, 158, 11, 0.1); backdrop-filter: blur(20px);
    position: relative;
  }
  
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 32px; }
  .brand h1 { font-family: 'Space Grotesk'; margin: 0; font-size: 28px; font-weight: 900; }
  
  .auth-title { font-family: 'JetBrains Mono'; font-size: 13px; color: var(--accent-amber); text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 32px;}

  .form-group { margin-bottom: 24px; }
  label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 13px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px;}
  input { 
    width: 100%; padding: 14px; background: rgba(0,0,0,0.3); 
    border: 1px solid var(--border-dim); color: #fff; border-radius: 8px; 
    font-family: 'JetBrains Mono'; box-sizing: border-box; transition: border-color 0.3s;
  }
  input:focus { border-color: var(--accent-amber); outline: none; box-shadow: 0 0 15px rgba(245,158,11,0.2); }
  
  .btn { 
    background: var(--accent-amber); color: #000; padding: 16px; border: none; 
    border-radius: 8px; font-family: 'Space Grotesk'; font-weight: 700; 
    cursor: pointer; width: 100%; font-size: 16px; transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(245, 158, 11, 0.5); }
  
  .error { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid var(--accent-red); padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 24px; font-size: 14px;}
  
  .footer-links { margin-top: 32px; text-align: center; font-size: 14px;}
  .footer-links a { color: var(--text-secondary); text-decoration: none; transition: color 0.2s;}
  .footer-links a:hover { color: #fff; }
</style>
</head>
<body>

<div class="login-container">
  <div class="brand">
    <img src="/static/logo.png" alt="SafeFleet Academy" style="width: 40px; height: 40px; border-radius: 8px; box-shadow: 0 0 15px rgba(245,158,11,0.4);">
    <h1>SafeFleet<span style="color: #f59e0b;"> Academy</span></h1>
  </div>
  
  <div class="auth-title">Training Portal Login</div>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" required placeholder="you@company.com.au">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn">Sign In to Portal</button>
  </form>
  
  <div class="footer-links">
    <a href="/">← Back to SafeFleet Academy Home</a>
  </div>
</div>

</body>
</html>
