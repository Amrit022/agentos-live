<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Settings — SafeFleet</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #f8fafc;
    --card-surface: rgba(255, 255, 255, 0.9);
    --border-dim: rgba(15, 23, 42, 0.08);
    --neon-blue: #1a73e8;
    --text-primary: #0f172a;
    --text-secondary: #475569;
  }
  body {
    background-color: var(--bg-void); color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0; padding: 48px;
  }
  .container { max-width: 600px; margin: 0 auto; background: var(--card-surface); padding: 40px; border-radius: 16px; border: 1px solid var(--border-dim); box-shadow: 0 10px 40px rgba(0,0,0,0.02); }
  h1 { font-family: 'Space Grotesk'; font-size: 32px; margin-top: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border-dim); padding-bottom: 16px;}
  .form-group { margin-bottom: 24px; }
  label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 14px; }
  input { width: 100%; padding: 12px; background: #fff; border: 1px solid var(--border-dim); color: var(--text-primary); border-radius: 8px; font-family: 'Plus Jakarta Sans'; box-sizing: border-box;}
  input:focus { border-color: var(--neon-blue); outline: none; }
  .btn { background: var(--neon-blue); color: #fff; padding: 12px 24px; border: none; border-radius: 8px; font-family: 'Space Grotesk'; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; box-shadow: 0 4px 15px rgba(26, 115, 232, 0.2); transition: background 0.2s, box-shadow 0.2s;}
  .btn:hover { background: #1557b0; box-shadow: 0 6px 20px rgba(26, 115, 232, 0.3); }
  .btn-outline { display: inline-block; text-align: center; background: transparent; color: var(--text-primary); padding: 12px 24px; border: 1px solid var(--border-dim); border-radius: 8px; text-decoration: none; width: 100%; box-sizing: border-box; margin-top: 16px; font-family: 'Space Grotesk'; font-weight: 700; transition: background 0.2s;}
  .btn-outline:hover { background: rgba(15,23,42,0.05); }
  .msg { background: rgba(26, 115, 232, 0.05); color: var(--neon-blue); padding: 12px; border-radius: 8px; margin-bottom: 24px; text-align: center; border: 1px solid var(--neon-blue); }
</style>
</head>
<body>
  <div class="container">
    <h1>Profile Settings</h1>
    {% if msg %}
      <div class="msg">{{ msg }}</div>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" value="{{ user['email'] if user else '' }}" disabled style="color: var(--text-secondary); cursor: not-allowed;">
      </div>
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" name="name" value="{{ user['name'] if user else '' }}" placeholder="Enter new name">
      </div>
      <div class="form-group">
        <label>New Password (Optional)</label>
        <input type="password" name="password" placeholder="Enter new password">
      </div>
      <button type="submit" class="btn">Save Changes</button>
      <a href="/portal" class="btn-outline">Return to Dashboard</a>
    </form>
  </div>
</body>
</html>
