<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ post.title }} — SafeFleet Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #f8fafc;
    --bg-card: rgba(255, 255, 255, 0.9);
    --border: rgba(15, 23, 42, 0.08);
    --accent-cyan: #1d4ed8;
    --accent-purple: #d97706;
    --text-main: #0f172a;
    --text-muted: #475569;
  }
  html { background-color: var(--bg-dark); }
  body { color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 40px; position: relative; min-height: 100vh; z-index: 1;}
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=2500&q=80');
    background-size: cover; background-position: center;
    opacity: 0.02; z-index: -1; pointer-events: none;
  }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; border-bottom: 1px solid var(--border); padding-bottom: 24px; max-width: 800px; margin: 0 auto 60px auto;}
  .btn { background: rgba(15, 23, 42, 0.05); color: var(--text-main); text-decoration: none; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); transition: background 0.3s; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px;}
  .btn:hover { background: rgba(29, 78, 216, 0.05); border-color: var(--accent-cyan); }
  
  .container { max-width: 800px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 48px; backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); }
  .blog-meta { font-size: 14px; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 16px; display: block;}
  h1 { font-family: 'Outfit', sans-serif; margin: 0 0 32px 0; font-size: 42px; line-height: 1.2; }
  .content { color: var(--text-muted); line-height: 1.8; font-size: 18px; white-space: pre-wrap; }
  .content h2 { font-family: 'Outfit', sans-serif; color: var(--text-main); margin-top: 40px; }
  .cta-box { background: rgba(15, 23, 42, 0.02); border: 1px dashed var(--border); padding: 32px; border-radius: 16px; margin-top: 48px; text-align: center; }
  .btn-primary { display: inline-block; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); color: #fff; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px; padding: 16px 32px; border-radius: 100px; border: none; cursor: pointer; text-decoration: none; margin-top: 16px; box-shadow: 0 4px 15px rgba(29, 78, 216, 0.2); transition: all 0.3s; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3); }
</style>
</head>
<body>
  <div class="header">
    <div style="font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700;">SafeFleet Academy</div>
    <div>
      <a href="/blog" class="btn">← Back to Blog</a>
    </div>
  </div>
  
  <div class="container">
    <span class="blog-meta">{{ post.timestamp[:10] }} • Case Study</span>
    <h1>{{ post.title }}</h1>
    
    <div class="content">{{ post.content }}</div>
    
    <div class="cta-box">
      <h3 style="margin-top: 0; font-family: 'Outfit', sans-serif; font-size: 24px; color: var(--text-main);">Ready to implement compliance?</h3>
      <p style="color: var(--text-muted);">Explore our premium transport compliance training courses and get your team certified today.</p>
      <a href="/" class="btn-primary">Explore Courses</a>
    </div>
  </div>
</body>
</html>
